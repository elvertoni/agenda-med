{% comment %}
Card de superfície do design system.

Args:
  title: título do card (opcional)
  body:  texto de apoio (opcional)

Para conteúdo complexo, use o bloco diretamente em vez deste include.
{% endcomment %}
<div class='rounded-2xl border border-slate-800 bg-slate-900/60 p-6 shadow-xl shadow-black/20 backdrop-blur'>
  {% if title %}<h3 class='text-lg font-semibold text-slate-100'>{{ title }}</h3>{% endif %}
  {% if body %}<p class='mt-2 text-sm text-slate-400'>{{ body }}</p>{% endif %}
</div>
