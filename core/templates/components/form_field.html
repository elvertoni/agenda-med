{% comment %}
Render a single bound form field with label, help text and inline errors.
Args:
  field: a bound form field (e.g. form.full_name).
{% endcomment %}
<div class='space-y-1.5'>
  <label for='{{ field.id_for_label }}'
         class='block text-sm font-medium text-slate-700 dark:text-slate-300'>
    {{ field.label }}{% if field.field.required %} <span class='text-rose-500 dark:text-rose-400'>*</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}
    <p class='text-xs text-slate-500 dark:text-slate-400'>{{ field.help_text }}</p>
  {% endif %}
  {% for error in field.errors %}
    <p class='text-xs text-rose-600 dark:text-rose-400'>{{ error }}</p>
  {% endfor %}
</div>
