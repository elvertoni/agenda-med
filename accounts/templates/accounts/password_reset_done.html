{% extends 'base.html' %}

{% block title %}E-mail enviado — Agenda Clínica{% endblock %}

{% block content %}
  <div class='mx-auto w-full max-w-md'>
    <div class='rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-sm dark:border-slate-800 dark:bg-slate-900/60'>
      <div class='mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-health-100 text-health-600 dark:bg-health-950 dark:text-health-400'>
        <svg class='h-6 w-6' fill='none' viewBox='0 0 24 24' stroke-width='1.5' stroke='currentColor'>
          <path stroke-linecap='round' stroke-linejoin='round' d='M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0l-7.5-4.615a2.25 2.25 0 0 1-1.07-1.916V6.75'/>
        </svg>
      </div>
      <h1 class='mt-4 text-xl font-semibold text-slate-900 dark:text-slate-100'>E-mail de redefinição enviado</h1>
      <p class='mt-2 text-sm leading-relaxed text-slate-500 dark:text-slate-400'>
        Se o e-mail informado estiver cadastrado, você receberá um link para redefinir a senha em instantes.
      </p>
      <div class='mt-6 border-t border-slate-200 pt-4 dark:border-slate-800'>
        <a href='{% url "accounts:login" %}'
           class='inline-flex w-full items-center justify-center rounded-xl bg-navy-900 px-4 py-2.5 text-sm font-medium text-white shadow-sm transition hover:bg-navy-800 focus:outline-none focus:ring-2 focus:ring-navy-700'>
          Voltar para o login
        </a>
      </div>
    </div>
  </div>
{% endblock %}
