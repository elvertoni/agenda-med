{% extends 'base.html' %}

{% block title %}Senha Redefinida — Agenda Clínica{% endblock %}

{% block content %}
  <div class='mx-auto w-full max-w-md'>
    <div class='rounded-2xl border border-slate-800 bg-slate-900/60 p-8 shadow-xl shadow-black/20 backdrop-blur text-center'>
      <div class='mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-emerald-500/10 text-emerald-400'>
        <svg class='h-6 w-6' fill='none' viewBox='0 0 24 24' stroke-width='1.5' stroke='currentColor'>
          <path stroke-linecap='round' stroke-linejoin='round' d='M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z' />
        </svg>
      </div>

      <h1 class='mt-4 text-2xl font-semibold tracking-tight text-slate-100'>Senha redefinida com sucesso!</h1>
      <p class='mt-2 text-sm text-slate-400 leading-relaxed'>
        Sua senha foi redefinida com sucesso. Agora você já pode acessar o sistema com sua nova senha.
      </p>

      <div class='mt-6 border-t border-slate-800 pt-4'>
        <a href='{% url "accounts:login" %}'
           class='inline-flex w-full items-center justify-center rounded-xl bg-emerald-500 px-4 py-2.5 text-sm font-medium text-slate-950 shadow-lg shadow-emerald-500/20 transition hover:bg-emerald-400 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:ring-offset-2 focus:ring-offset-slate-950'>
          Acessar o login
        </a>
      </div>
    </div>
  </div>
{% endblock %}
