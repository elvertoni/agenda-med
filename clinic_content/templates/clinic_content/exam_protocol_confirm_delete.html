{% extends 'layouts/dashboard_base.html' %}

{% block title %}Excluir protocolo de exame — Agenda Clínica{% endblock %}

{% block dashboard_content %}
  <div class='mx-auto w-full max-w-xl'>
    <div class='rounded-2xl border border-slate-800 bg-slate-900/60 p-6 shadow-xl shadow-black/20 backdrop-blur'>
      <h1 class='text-xl font-semibold text-slate-100'>Excluir protocolo de exame</h1>
      <p class='mt-2 text-sm text-slate-400'>
        Tem certeza que deseja excluir <strong class='text-slate-200'>{{ object.exam_name }}</strong>?
      </p>
      <form method='post' class='mt-6 flex items-center gap-3'>
        {% csrf_token %}
        <button type='submit'
                class='inline-flex items-center justify-center rounded-xl bg-rose-500 px-4 py-2.5 text-sm font-medium text-slate-950 transition hover:bg-rose-400'>
          Excluir
        </button>
        <a href='{% url "clinic_content:exam_protocol_list" %}'
           class='inline-flex items-center justify-center rounded-xl border border-slate-700 bg-slate-900 px-4 py-2.5 text-sm font-medium text-slate-200 transition hover:bg-slate-800'>
          Cancelar
        </a>
      </form>
    </div>
  </div>
{% endblock %}
